<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="profile">
        <div class="profile__imagecard">
            <img class="profile__image" src="Photo.jpeg" alt="Profile Picture">
        </div>
        <div class="profile__desc">
            <a href="index.html">
                <h1 class="profile__name-link">Nithya Subburamu</h1>
            </a>
            <p class="profile__title">Creative Full Stack Web Developer</p><br>
            <a class="profile__contact-link" href="Contact.html">Contact Me</a>
        </div>
    </div>

    <div class="contact-form">
    <form>
        <table>
            <tr>
                <td>Name : </td>
                <td><input class="contact-form__input" type="text" name="name" required placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Email : </td>
                <td><input class="contact-form__input" type="email" name="email" required placeholder="Enter your email"></td>
            </tr>
            <tr>
                <td>Message :</td>
                <td><textarea class="contact-form__textarea" name="message" placeholder="Enter your message"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input class="contact-form__submit" type="submit" value="Submit">
                </td>
            </tr>
        </table>
    </form><br>
    </div>

    <div class="footer">
        <h4 class="footer__title">Social Media</h4>
        <a class="footer__link" href="https://www.linkedin.com/in/nithya37/?isSelfProfile=true"
            target="_blank">LinkedIn</a>
        <a class="footer__link" href="https://www.behance.net/nithya_s" target="_blank">Behance</a>

        <p class="footer__rights">&copy; 2023 Nithya Subburamu. All rights reserved.</p>
    </div>

</body>

</html>
